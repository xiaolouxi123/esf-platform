name: uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  probe:
    name: production probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 2 --retry-delay 3 --max-time 25 http://119.91.99.176:3000/api/health)"
          printf '%s\n' "$body"
          echo "$body" | jq -e '.ok == true and .data.db == "up"' >/dev/null

      - name: Backup freshness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 2 --retry-delay 3 --max-time 25 http://119.91.99.176:3000/ops/backup.json)"
          printf '%s\n' "$body"
          BODY="$body" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          body = json.loads(os.environ["BODY"])
          if body.get("ok") is not True:
              raise SystemExit(f"backup is not healthy: {body.get('error', 'unknown')}")
          raw = body.get("lastSuccessAt")
          if not raw:
              raise SystemExit("backup status has no lastSuccessAt")
          ts = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          print(f"backup age={age:.2f}h file={body.get('file')} size={body.get('size')}")
          if age > 30:
              raise SystemExit(f"backup is stale: {age:.2f}h")
          PY

      - name: Static website
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --retry 2 --retry-delay 3 --max-time 25 https://xiaolouxi123.github.io/esf-platform/)"
          printf '%s' "$html" | grep -q 'ESF China'

      - name: Release feed
        shell: bash
        run: |
          set -euo pipefail
          feed="$(curl -fsSL --retry 2 --retry-delay 3 --max-time 25 https://github.com/xiaolouxi123/esf-platform/releases/latest/download/latest.yml)"
          printf '%s\n' "$feed" | head -n 8
          printf '%s' "$feed" | grep -q '^version:'

      - name: Alert annotation
        if: failure()
        shell: bash
        run: echo "::error::Production uptime probe failed. Check the failed step above and the GitHub notification email."
