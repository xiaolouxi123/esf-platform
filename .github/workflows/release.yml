name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.4.2-mirror'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esf-launcher/package-lock.json

      - name: Install dependencies
        working-directory: esf-launcher
        run: npm ci

      - name: Build Windows installer
        working-directory: esf-launcher
        run: npm run dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          name: ESF Platform 0.4.2
          body: |
            ESF China 龙珠社区一体化平台 0.4.2。

            - 新龙珠图标
            - 更新支持暂停 / 继续 / 关闭
            - 修复本地混战 / 组队切换
            - 官网：https://esfchina.com/
          files: |
            esf-launcher/release/ESF-Platform-Setup-*.exe
            esf-launcher/release/*.blockmap
            esf-launcher/release/latest.yml
          fail_on_unmatched_files: false
          generate_release_notes: false
