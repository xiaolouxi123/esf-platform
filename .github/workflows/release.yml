name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esf-launcher/package-lock.json

      - name: Set version from tag
        working-directory: esf-launcher
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: esf-launcher
        run: npm ci

      - name: Build Windows installer
        working-directory: esf-launcher
        run: npm run dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ESF Platform ${{ github.ref_name }}
          body: |
            ESF China 龙珠社区一体化平台。

            下载安装包，或用启动器自动更新。
          files: |
            esf-launcher/release/ESF-Platform-Setup-*.exe
            esf-launcher/release/*.blockmap
            esf-launcher/release/latest.yml
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Carry previous blockmap forward
        # The generic feed resolves the old blockmap through
        # releases/latest/download/<old>.blockmap. Keep the previous
        # release's blockmap on the new release so differential updates
        # do not fall back to a full 128 MB download.
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = gh release list --limit 20 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne "${{ github.ref_name }}" } |
            Select-Object -First 1
          if (-not $prev) {
            Write-Host "No previous release found."
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "previous-blockmaps"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $prev --pattern "*.blockmap" --dir $dir
          $files = @(Get-ChildItem $dir -Filter *.blockmap | ForEach-Object FullName)
          if ($files.Count -eq 0) {
            Write-Host "No blockmap assets in $prev."
            exit 0
          }
          gh release upload "${{ github.ref_name }}" $files --clobber
