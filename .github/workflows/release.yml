name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esf-launcher/package-lock.json

      - name: Set version from tag
        working-directory: esf-launcher
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm version $version --no-git-tag-version

      - name: Install dependencies
        working-directory: esf-launcher
        run: npm ci

      - name: Build Windows installer
        working-directory: esf-launcher
        run: npm run dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ESF Platform ${{ github.ref_name }}
          body: |
            ESF China 龙珠社区一体化平台。

            下载安装包，或用启动器自动更新。
          files: |
            esf-launcher/release/ESF-Platform-Setup-*.exe
            esf-launcher/release/*.blockmap
            esf-launcher/release/latest.yml
          fail_on_unmatched_files: false
          generate_release_notes: false
