name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esf-launcher/package-lock.json

      - name: Set version from tag
        working-directory: esf-launcher
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # workflow_dispatch 时 ref_name 是分支名（如 main），不能拿它当版本号
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release must be triggered by a vX.Y.Z tag; got: $tag"
          }
          $version = $tag.Substring(1)
          npm version $version --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: esf-launcher
        run: npm ci

      - name: Build Windows installer
        working-directory: esf-launcher
        run: npm run dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ESF Platform ${{ github.ref_name }}
          body: |
            ESF China 龙珠社区一体化平台。

            下载安装包，或用启动器自动更新。
          files: |
            esf-launcher/release/ESF-Platform-Setup-*.exe
            esf-launcher/release/*.blockmap
            esf-launcher/release/latest.yml
          # 安装包 / blockmap / latest.yml 缺一不可，缺产物必须让发布失败
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Carry all historical blockmaps forward
        # The generic feed resolves an old blockmap through
        # releases/latest/download/<old>.blockmap. Keep EVERY historical
        # release's blockmap on the new release so any old client can do a
        # differential update instead of falling back to a full 128 MB download.
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = "${{ github.ref_name }}"
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne $current })
          if ($tags.Count -eq 0) {
            Write-Host "No previous releases found."
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "historical-blockmaps"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($tag in $tags) {
            # Early releases may have no blockmap asset; skip them, do not fail the publish.
            gh release download $tag --pattern "*.blockmap" --dir $dir --clobber 2>$null
            if ($LASTEXITCODE -ne 0) { Write-Host "Skip $tag (no blockmap asset)" }
          }
          $files = @(Get-ChildItem $dir -Filter *.blockmap | ForEach-Object FullName)
          if ($files.Count -eq 0) {
            Write-Host "No historical blockmaps found."
            exit 0
          }
          Write-Host ("Carrying " + $files.Count + " historical blockmaps:")
          $files | ForEach-Object { Write-Host ("  " + (Split-Path $_ -Leaf)) }
          gh release upload $current $files --clobber
